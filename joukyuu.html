  <style>
    :root {
      --primary: #f39c12;
      --bg: #f8f4ea;
      --text: #2d3436;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', 'Yu Gothic', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 8px 48px;
    }
    .game-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 820px;
      margin-bottom: 8px;
      flex-wrap: wrap;
      gap: 8px;
    }
    .nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 6px 14px;
      background: white;
      border: 1px solid #dcdde1;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: bold;
      color: #57606f;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.15s;
    }
    .nav-btn:hover { background: #f1f2f6; border-color: #b2bec3; }
    .level-badge {
      background: #f39c12;
      color: white;
      padding: 6px 18px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.9rem;
      box-shadow: 0 2px 6px rgba(243, 156, 18, 0.3);
    }
    .controls-container {
      width: 100%;
      max-width: 820px;
      position: sticky;
      top: 8px;
      z-index: 100;
      margin-bottom: 12px;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(8px);
      padding: 8px 14px;
      border-radius: 14px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }
    .stats { display: flex; gap: 10px; align-items: center; font-weight: bold; font-size: 0.9rem; }
    .stat-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #f1f2f6;
      padding: 4px 10px;
      border-radius: 20px;
    }
    .stat-badge.bingo-badge {
      background: #fef3d6;
      color: #b33939;
      border: 1px solid #f9ca24;
    }
    .stat-badge .num { font-size: 1.15rem; color: #e84118; font-weight: 800; }
    .btn-group { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 6px 12px;
      border: 1px solid #dcdde1;
      border-radius: 8px;
      background: white;
      color: #2f3542;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn:hover { background: #f1f2f6; }
    .btn-reset { color: #e84118; border-color: #ffb8b8; }
    .btn-save { background: #10ac84; color: white; border-color: #10ac84; }
    .btn-sound.muted { color: #a4b0be; background: #f1f2f6; }

    .bingo-wrapper {
      position: relative;
      width: 100%;
      max-width: 820px;
      box-shadow: 0 8px 30px rgba(71, 52, 28, 0.14);
      border-radius: 12px;
      overflow: hidden;
      background: #fff;
    }
    .bingo-img { width: 100%; height: auto; display: block; user-select: none; }
    .grid-overlay {
      position: absolute;
      display: grid;
      z-index: 10;
      top: 33.272%;
      left: 6.745%;
      width: 86.444%;
      height: 60.998%;
      grid-template-columns: repeat(11, 1fr);
      grid-template-rows: repeat(11, 1fr);
    }
    .bingo-cell {
      position: relative;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.15s ease;
    }
    .bingo-cell:hover { background-color: rgba(255, 235, 59, 0.25); }
    .bingo-cell.in-bingo {
      animation: bingo-glow 1.6s ease-in-out infinite alternate;
    }
    @keyframes bingo-glow {
      0% { background-color: rgba(255, 215, 0, 0.28); box-shadow: inset 0 0 8px rgba(255, 177, 0, 0.5); }
      100% { background-color: rgba(255, 242, 0, 0.48); box-shadow: inset 0 0 16px rgba(255, 121, 0, 0.85); }
    }
    .circle-mark {
      position: absolute;
      width: 86%;
      height: 86%;
      pointer-events: none;
      animation: stamp-pop 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    @keyframes stamp-pop {
      0% { transform: scale(0.2) rotate(var(--rot, 0deg)); opacity: 0; }
      70% { transform: scale(1.12) rotate(var(--rot, 0deg)); opacity: 0.95; }
      100% { transform: scale(1) rotate(var(--rot, 0deg)); opacity: 0.88; }
    }
    .cell-info-bar { margin-top: 8px; font-size: 0.85rem; color: #636e72; min-height: 20px; text-align: center; }

    /* モーダル */
    .modal-backdrop {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000; opacity: 0; visibility: hidden; transition: all 0.28s ease; padding: 16px;
    }
    .modal-backdrop.show { opacity: 1; visibility: visible; }
    .modal-card {
      background: white; border-radius: 24px; padding: 28px 24px; max-width: 420px; width: 100%;
      text-align: center; box-shadow: 0 20px 45px rgba(0,0,0,0.35);
      transform: scale(0.7) translateY(20px); transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative; overflow: hidden;
    }
    .modal-backdrop.show .modal-card { transform: scale(1) translateY(0); }
    .modal-card::before {
      content: ""; position: absolute; top: 0; left: 0; right: 0; height: 8px;
      background: linear-gradient(90deg, #feca57, #ff9f43, #55efc4, #74b9ff);
    }
    .modal-icon { font-size: 3.2rem; margin-bottom: 8px; animation: bounce 1s infinite alternate; }
    @keyframes bounce { 0% { transform: translateY(0); } 100% { transform: translateY(-8px); } }
    .modal-title { font-size: 2.3rem; font-weight: 900; color: #e84118; margin-bottom: 6px; }
    .modal-message { font-size: 1.15rem; font-weight: bold; margin-bottom: 12px; }
    .modal-stats {
      background: #fdf6e2; border: 2px dashed #f39c12; border-radius: 12px;
      padding: 12px; margin-bottom: 20px; display: flex; justify-content: space-around; font-weight: bold;
    }
    .modal-close-btn {
      background: linear-gradient(135deg, #feca57, #ff9f43); color: white; border: none;
      padding: 12px 32px; font-size: 1.05rem; font-weight: bold; border-radius: 30px; cursor: pointer;
    }
    #confetti-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 2000; }
    #export-canvas { display: none; }
    footer { margin-top: 16px; font-size: 0.82rem; color: #888; text-align: center; }
  </style>
</head>
<body>

        <div><div style="font-size:0.8rem;color:#888;">訪れた動物園</div><div style="font-size:1.4rem;color:#d35400;" id="modal-visited-count">11 園</div></div>

      <button class="modal-close-btn" onclick="closeModal()">続けてあそぶ</button>

  </div>

  <canvas id="confetti-canvas"></canvas>
  <canvas id="export-canvas"></canvas>
  <script src="images_data.js"></script>

  <script>
    const NAMES = [
      "愛媛県立とべ動物園", "群馬サファリパーク", "のんほいパーク", "福山市立動物園", "足立区生物園", "熊本市動植物園", "姫路セントラルパーク", "おびひろ動物園", "霞ヶ浦どうぶつとみんなのいえ", "岩手サファリパーク", "海の中道海浜公園動物の森",
      "よこはま動物園ズーラシア", "和歌山城公園動物園", "到津の森公園", "宇都宮動物園", "大牟田市動物園", "飯田市立動物園", "ときわ動物園", "伊豆アニマルキングダム", "淡路ファームパークイングランドの丘", "長崎鼻パーキングガーデン", "鞍ヶ池公園動物園",
      "九州自然動物公園アフリカンサファリ", "草津熱帯圏", "智光山公園こども動物園", "大崎自然公園くじゃく園", "須坂市動物園", "河北町児童動物園", "上野動物園", "多摩動物公園", "旭山動物園", "京都市動物園", "鯖江市西山動物園",
      "大森山動物園", "五月山動物園", "大島公園動物園", "城山動物園", "高知県立のいち動物公園", "大宮公園小動物園", "大町山岳博物館", "麻溝公園ふれあい動物広場", "富山市ファミリーパーク", "安佐動物公園", "沖縄こどもの国",
      "松本市アルプス公園小鳥と小動物の森", "熱川バナナワニ園", "九十九島動植物園森きらら", "市川市動植物園", "秋吉台サファリパーク", "長岡市悠久山小動物園", "岡崎市東公園動物園", "王子動物園", "平川動物公園", "那須ワールドモンキーパーク", "弥生いこいの広場",
      "姫路市立動物園", "円山動物園", "石川県森林公園森林動物園", "市原ぞうの国", "宮崎市フェニックス自然動物園", "大内山動物園", "長崎公園どうぶつひろば", "浜松市動物園", "龍野公園動物園", "茶臼山動物園", "夢見ヶ崎動物公園",
      "江戸川区自然動物園", "やんばるクイナ生態展示学習施設 クイナの森", "上尾丸山公園小動物園", "天王寺動物園", "東山動植物園", "池田動物園", "金沢動物園", "東北サファリパーク", "東武動物公園", "町田リス園", "伊豆シャボテン動物公園",
      "周南市徳山動物園", "小諸市動物園", "函館公園動物施設", "東筑波ユートピア", "とくしま動物園", "日本モンキーセンター", "阿蘇カドリー・ドミニオン", "那須どうぶつ王国", "掛川花鳥園", "千葉市動物公園", "別府ケーブルラクテンチ",
      "福知山市動物園", "埼玉県こども動物自然公園", "遊亀公園附属動物園", "三島市楽寿園", "釧路市動物園", "日立市かみね動物園", "万力公園動物広場", "長崎バイオパーク", "井の頭自然文化園", "足羽山公園遊園地", "アドベンチャーワールド",
      "久留米市鳥類センター", "しろとり動物園", "野毛山動物園", "桐生が岡動物園", "八木山動物公園", "神戸どうぶつ王国", "いしかわ動物園", "iZoo", "渋川動物公園", "日本平動物園", "キャンベルタウン野鳥の森",
      "那須サファリパーク", "ネオパークオキナワ", "ごかつら池どうぶつパーク", "高岡古城公園動物園", "大崎公園こども動物園", "富士サファリパーク", "盛岡市動物公園 ZOOMO", "羽村市動物公園", "わんぱーくこうちアニマルランド", "松江フォーゲルパーク", "福岡市動物園"
    ];

    const STORAGE_KEY = 'zoo_bingo_joukyuu_state_v2';
    let checkedCells = new Set();
    let prevBingoCount = 0;
    let soundEnabled = true;

    function createStampSvg(rot) {
      return `
        <svg class="circle-mark" viewBox="0 0 100 100" style="--rot: ${rot}deg;">
          <ellipse cx="50" cy="50" rx="38" ry="39" fill="none" stroke="#e74c3c" stroke-width="5.5" stroke-linecap="round" stroke-dasharray="235 15"/>
        </svg>
      `;
    }

    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    function playSound(type) {
      if (!soundEnabled) return;
      try {
        if (!audioCtx) audioCtx = new AudioCtx();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;
        if (type === 'check') {
          const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
          osc.frequency.setValueAtTime(450, now); osc.frequency.exponentialRampToValueAtTime(750, now + 0.08);
          gain.gain.setValueAtTime(0.25, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.start(now); osc.stop(now + 0.1);
        } else if (type === 'uncheck') {
          const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
          osc.frequency.setValueAtTime(600, now); osc.frequency.exponentialRampToValueAtTime(300, now + 0.06);
          gain.gain.setValueAtTime(0.18, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.start(now); osc.stop(now + 0.08);
        } else if (type === 'bingo') {
          [523.25, 659.25, 783.99, 1046.50, 1318.51].forEach((freq, idx) => {
            const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
            const t = now + idx * 0.09;
            osc.type = 'triangle'; osc.frequency.setValueAtTime(freq, t);
            gain.gain.setValueAtTime(0.28, t); gain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(t); osc.stop(t + 0.3);
          });
        }
      } catch (e) {}
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      const btn = document.getElementById('btn-sound');
      btn.textContent = soundEnabled ? '🔊 音あり' : '🔇 音なし';
      btn.classList.toggle('muted', !soundEnabled);
    }

    function init() {
      if (window.IMAGE_JOUKYUU_B64) {
        document.getElementById('bingo-img').src = window.IMAGE_JOUKYUU_B64;
      }
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) checkedCells = new Set(JSON.parse(saved));
      } catch (e) {}

      const overlay = document.getElementById('grid-overlay');
      overlay.innerHTML = '';
      for (let i = 0; i < 121; i++) {
        const cell = document.createElement('div');
        cell.className = 'bingo-cell';
        cell.dataset.index = i;
        const name = NAMES[i];
        cell.title = name;
        const rot = ((i * 17) % 25) - 12;
        cell.dataset.rot = rot;
        if (checkedCells.has(i)) {
          cell.classList.add('checked');
          cell.innerHTML = createStampSvg(rot);
        }
        cell.addEventListener('mouseenter', () => document.getElementById('cell-info-bar').textContent = `📍 ${name}`);
        cell.addEventListener('mouseleave', () => document.getElementById('cell-info-bar').textContent = 'マスをクリックすると赤〇が付きます');
        cell.addEventListener('click', () => {
          if (checkedCells.has(i)) {
            checkedCells.delete(i);
            cell.classList.remove('checked');
            cell.innerHTML = '';
            playSound('uncheck');
          } else {
            checkedCells.add(i);
            cell.classList.add('checked');
            cell.innerHTML = createStampSvg(rot);
            playSound('check');
          }
          localStorage.setItem(STORAGE_KEY, JSON.stringify([...checkedCells]));
          updateBingo(true);
        });
        overlay.appendChild(cell);
      }
      updateBingo(false);
    }

    function updateBingo(trigger) {
      const winning = new Set();
      let lines = 0;
      for (let r = 0; r < 11; r++) {
        const row = Array.from({length: 11}, (_, c) => r * 11 + c);
        if (row.every(i => checkedCells.has(i))) { lines++; row.forEach(i => winning.add(i)); }
      }
      for (let c = 0; c < 11; c++) {
        const col = Array.from({length: 11}, (_, r) => r * 11 + c);
        if (col.every(i => checkedCells.has(i))) { lines++; col.forEach(i => winning.add(i)); }
      }
      const d1 = Array.from({length: 11}, (_, i) => i * 11 + i);
      if (d1.every(i => checkedCells.has(i))) { lines++; d1.forEach(i => winning.add(i)); }
      const d2 = Array.from({length: 11}, (_, i) => i * 11 + (10 - i));
      if (d2.every(i => checkedCells.has(i))) { lines++; d2.forEach(i => winning.add(i)); }

      document.getElementById('stat-visited').textContent = checkedCells.size;
      document.getElementById('stat-bingo').textContent = lines;

      document.querySelectorAll('.bingo-cell').forEach(cell => {
        const idx = parseInt(cell.dataset.index, 10);
        cell.classList.toggle('in-bingo', winning.has(idx));
      });

      if (trigger && lines > prevBingoCount) {
        playSound('bingo');
        startConfetti();
        document.getElementById('modal-message').textContent = `${lines} 列ビンゴ達成！おめでとうございます！`;
        document.getElementById('modal-bingo-count').textContent = `${lines} 列`;
        document.getElementById('modal-visited-count').textContent = `${checkedCells.size} 園`;
        document.getElementById('bingo-modal').classList.add('show');
      }
      prevBingoCount = lines;
    }

    function closeModal() {
      document.getElementById('bingo-modal').classList.remove('show');
      stopConfetti();
    }

    function confirmReset() {
      if (checkedCells.size > 0 && confirm('上級編のチェックをすべてクリアしますか？')) {
        checkedCells.clear();
        prevBingoCount = 0;
        localStorage.setItem(STORAGE_KEY, JSON.stringify([]));
        init();
      }
    }

    function saveAsImage() {
      const canvas = document.getElementById('export-canvas');
      const ctx = canvas.getContext('2d');
      const img = new Image();
      img.onload = () => {
        canvas.width = 1527; canvas.height = 2164;
        ctx.drawImage(img, 0, 0, 1527, 2164);
        checkedCells.forEach(idx => {
          const col = idx % 11, row = Math.floor(idx / 11);
          const cx = 103 + col * 120 + 60, cy = 720 + row * 120 + 60;
          ctx.save();
          ctx.translate(cx, cy);
          ctx.rotate((((idx * 17) % 25) - 12) * Math.PI / 180);
          ctx.strokeStyle = 'rgba(231, 76, 60, 0.9)';
          ctx.lineWidth = 6.6; ctx.lineCap = 'round';
          ctx.beginPath(); ctx.ellipse(0, 0, 45, 46, 0, 0, Math.PI * 1.95); ctx.stroke();
          ctx.restore();
        });
        const link = document.createElement('a');
        link.download = 'zoo_bingo_joukyuu_marked.jpg';
        link.href = canvas.toDataURL('image/jpeg', 0.92);
        link.click();
      };
      img.src = window.IMAGE_JOUKYUU_B64 || 'joukyuu.JPG';
    }

    // Confetti
    const cCanvas = document.getElementById('confetti-canvas'), cCtx = cCanvas.getContext('2d');
    let cParticles = [], cAnimId = null;
    function resizeConfetti() { cCanvas.width = window.innerWidth; cCanvas.height = window.innerHeight; }
    window.addEventListener('resize', resizeConfetti);
    resizeConfetti();

    function startConfetti() {
      resizeConfetti(); cParticles = [];
      const colors = ['#ff7675', '#74b9ff', '#55efc4', '#ffeaa7', '#a29bfe', '#fd79a8'];
      for (let i = 0; i < 120; i++) {
        cParticles.push({
          x: Math.random() * cCanvas.width, y: Math.random() * -cCanvas.height * 0.5,
          w: Math.random() * 10 + 6, h: Math.random() * 8 + 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          vx: (Math.random() - 0.5) * 4, vy: Math.random() * 3 + 2.5,
          rot: Math.random() * 360, rotSpeed: (Math.random() - 0.5) * 8
        });
      }
      if (!cAnimId) animateConfetti();
    }
    function animateConfetti() {
      cCtx.clearRect(0, 0, cCanvas.width, cCanvas.height);
      let count = 0;
      cParticles.forEach(p => {
        p.x += p.vx; p.y += p.vy; p.rot += p.rotSpeed;
        if (p.y < cCanvas.height) {
          count++; cCtx.save(); cCtx.translate(p.x, p.y); cCtx.rotate(p.rot * Math.PI / 180);
          cCtx.fillStyle = p.color; cCtx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); cCtx.restore();
        }
      });
      if (count > 0) cAnimId = requestAnimationFrame(animateConfetti);
      else stopConfetti();
    }
    function stopConfetti() {
      if (cAnimId) { cancelAnimationFrame(cAnimId); cAnimId = null; }
      cCtx.clearRect(0, 0, cCanvas.width, cCanvas.height);
    }

    init();
  </script>
</body>
</html>
